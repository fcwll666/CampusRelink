name: Build and package

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run isolated tests, compile and package
        shell: powershell
        run: .\Package.ps1
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: artifacts/tests/**/results.*
          if-no-files-found: warn
          retention-days: 14
      - name: Upload release packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-packages
          path: |
            dist/CampusRelink-1.0.3-source.zip
            dist/CampusRelink-1.0.3-win-x64.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Download validated packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: dist
      - name: Create draft GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -ne 'v1.0.3') { throw 'Update package version metadata before publishing another release tag.' }
          $assets = @('dist/CampusRelink-1.0.3-source.zip', 'dist/CampusRelink-1.0.3-win-x64.zip')
          $assets += (Resolve-Path -LiteralPath dist/SHA256SUMS).Path
          gh release create $env:RELEASE_TAG @assets --draft --verify-tag --title "CampusRelink $env:RELEASE_TAG" --notes 'CampusRelink 1.0.3 adopts the new name and embedded application icon, defaults to the Nanjing University of Chinese Medicine portal at http://net.njucm.edu.cn/api/portal/v1/login, and keeps the login URL editable. Saved passwords use a fixed 15-asterisk placeholder. Existing CampusFlow Community data and startup identifiers remain compatible. See CHANGELOG, README and NOTICE before use. Binaries are unsigned; no live campus environment is certified.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub draft release creation failed.' }
